name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI launches a window yet, and the binary is ~150 MB per run.
  # This is removed by M3, which is the first milestone that starts Electron.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # The engine runs on Electron's Node and the CLI runs on the system's,
          # so packages/ targets the lower of the two (ADR-0011 §5). That is 22
          # while Electron 43 bundles 24.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc -b in dependency order. This is the typecheck; there is no separate
      # --noEmit pass, because build mode is what checks project references.
      - run: pnpm typecheck

      - run: pnpm check:ci

      # CSS has no undefined-variable error, so this is the only thing that sees
      # a typo'd design token. It is in place before the first component, not
      # after the first bug. See docs/TODO.md §4.
      - run: pnpm check:css

      - run: pnpm test

  native:
    name: Native modules on ${{ matrix.os }}
    # Electron's binary is needed here and only here: the point of the job is
    # to load each module under both Node ABIs, and one of them is Electron's.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Native modules are the point of this job, so their build scripts have to
      # run. `pnpm-workspace.yaml` allows exactly the two that need them.
      - run: pnpm install --frozen-lockfile

      # The engine and the CLI run on different Node ABIs — Electron 43 bundles
      # Node 24 (ABI 148), the CLI uses the system's 22 (ABI 127) — so a module
      # that loads in one is not thereby proven to load in the other. Both
      # current modules are Node-API and the same binary serves both
      # (ADR-0009), which is a claim that has to keep being true, not a fact to
      # be assumed once.
      - run: node --experimental-strip-types scripts/probe-native.ts --both

      - run: pnpm test
